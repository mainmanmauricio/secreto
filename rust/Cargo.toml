[workspace]
resolver = "2"
members = [
    "crates/secreto-core",
    "crates/secreto-cli",
    "crates/secreto-vectors",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
authors = ["secreto contributors"]
rust-version = "1.88"

[workspace.dependencies]
secreto-core = { path = "crates/secreto-core" }
argon2 = "0.6"
base64 = "0.22"
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "3", features = ["zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
ml-kem = { version = "0.3.4", features = ["zeroize"] }
ml-dsa = { version = "0.1.2", features = ["zeroize"] }
p384 = { version = "0.14", features = ["ecdh", "arithmetic"] }
sha2 = "0.11"
sha3 = "0.12"
shake = "0.1"
subtle = "2"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
chacha20 = { version = "0.10", features = ["rng"] }
rand_core = "0.10"
