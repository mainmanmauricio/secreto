[package]
name = "secreto-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Command-line tools `secreto` and `secreto-keygen`"

[lib]
name = "secreto_cli"
path = "src/lib.rs"

[[bin]]
name = "secreto"
path = "src/main.rs"

[[bin]]
name = "secreto-keygen"
path = "src/bin/secreto-keygen.rs"

[dependencies]
secreto-core.workspace = true
clap.workspace = true
rpassword.workspace = true
zeroize.workspace = true
